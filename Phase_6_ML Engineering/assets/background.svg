<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050E1F"/>
      <stop offset="0.55" stop-color="#0A1F40"/>
      <stop offset="1" stop-color="#071530"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.85" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#1E6FD9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1E6FD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.08" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#F7931E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F7931E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4FA3FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FA3FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4FA3FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7931E" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#F7931E" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFC56E" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glowBlue)"/>
  <rect width="1600" height="1000" fill="url(#glowOrange)"/>

  <!-- Wireframe globe (top right) -->
  <g transform="translate(1390 170)" fill="none" stroke="#6FB6FF" stroke-width="1.2">
    <circle r="250" stroke-opacity="0.35"/>
    <ellipse rx="250" ry="80" stroke-opacity="0.18"/>
    <ellipse rx="250" ry="160" stroke-opacity="0.14"/>
    <ellipse cy="-125" rx="216" ry="55" stroke-opacity="0.12"/>
    <ellipse cy="125" rx="216" ry="55" stroke-opacity="0.12"/>
    <ellipse rx="80" ry="250" stroke-opacity="0.18"/>
    <ellipse rx="165" ry="250" stroke-opacity="0.14"/>
    <line y1="-250" y2="250" stroke-opacity="0.18"/>
    <g fill="#9CD0FF" stroke="none" fill-opacity="0.55">
      <circle cx="-120" cy="-60" r="3"/><circle cx="40" cy="-140" r="2.5"/>
      <circle cx="150" cy="30" r="3"/><circle cx="-60" cy="110" r="2.5"/>
      <circle cx="90" cy="160" r="2"/><circle cx="-190" cy="40" r="2"/>
    </g>
  </g>

  <!-- Trade route arc -->
  <path d="M-40 520 C 420 120, 980 60, 1510 120" fill="none" stroke="url(#arc)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="1510" cy="120" r="5" fill="#FFC56E"/>
  <circle cx="1510" cy="120" r="14" fill="#F7931E" fill-opacity="0.18"/>

  <!-- Network of nodes (left) -->
  <g stroke="#4FA3FF" stroke-opacity="0.2" stroke-width="1">
    <line x1="90" y1="160" x2="230" y2="250"/><line x1="230" y1="250" x2="170" y2="390"/>
    <line x1="230" y1="250" x2="360" y2="200"/><line x1="170" y1="390" x2="310" y2="450"/>
    <line x1="360" y1="200" x2="310" y2="450"/><line x1="90" y1="160" x2="60" y2="320"/>
    <line x1="60" y1="320" x2="170" y2="390"/>
  </g>
  <g fill="#6FB6FF" fill-opacity="0.45">
    <circle cx="90" cy="160" r="4"/><circle cx="230" cy="250" r="5"/>
    <circle cx="170" cy="390" r="4"/><circle cx="360" cy="200" r="3.5"/>
    <circle cx="310" cy="450" r="4"/><circle cx="60" cy="320" r="3"/>
  </g>
  <circle cx="230" cy="250" r="5" fill="#F7931E" fill-opacity="0.8"/>

  <!-- Trade volume bars and trend line (bottom) -->
  <g fill="#4FA3FF" fill-opacity="0.09">
    <rect x="0" y="880" width="34" height="120"/><rect x="50" y="850" width="34" height="150"/>
    <rect x="100" y="900" width="34" height="100"/><rect x="150" y="830" width="34" height="170"/>
    <rect x="200" y="870" width="34" height="130"/><rect x="250" y="810" width="34" height="190"/>
    <rect x="300" y="860" width="34" height="140"/><rect x="350" y="790" width="34" height="210"/>
    <rect x="1250" y="860" width="34" height="140"/><rect x="1300" y="820" width="34" height="180"/>
    <rect x="1350" y="880" width="34" height="120"/><rect x="1400" y="800" width="34" height="200"/>
    <rect x="1450" y="840" width="34" height="160"/><rect x="1500" y="770" width="34" height="230"/>
    <rect x="1550" y="820" width="34" height="180"/>
  </g>
  <path d="M0 860 L120 830 L240 845 L360 780 L480 800 L600 740 L720 770 L840 710 L960 735 L1080 680 L1200 700 L1320 640 L1440 665 L1600 600 L1600 1000 L0 1000 Z" fill="url(#area)"/>
  <path d="M0 860 L120 830 L240 845 L360 780 L480 800 L600 740 L720 770 L840 710 L960 735 L1080 680 L1200 700 L1320 640 L1440 665 L1600 600" fill="none" stroke="#4FA3FF" stroke-opacity="0.45" stroke-width="2"/>
  <g fill="#9CD0FF" fill-opacity="0.7">
    <circle cx="360" cy="780" r="3"/><circle cx="840" cy="710" r="3"/><circle cx="1320" cy="640" r="3"/>
  </g>
</svg>
