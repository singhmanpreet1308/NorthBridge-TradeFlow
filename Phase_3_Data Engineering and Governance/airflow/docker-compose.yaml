
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:3.1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow_env

       AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres/airflow"
       AIRFLOW__CORE__EXECUTOR: LocalExecutor
       AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
       AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET is required}
       AIRFLOW__CORE__LOAD_EXAMPLES: "False"
       AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
       AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
       # Azure ADLS Gen2 authentication
       AZURE_TENANT_ID: ${AZURE_TENANT_ID}
       AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
       AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
    volumes: &airflow_volumes
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../pipeline:/opt/airflow/northbridge_pipeline:ro
    command: >
      bash -c "airflow db migrate"

  airflow-api-server:
    image: apache/airflow:3.1.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_volumes
    ports:
      - "8080:8080"
    command: api-server

  airflow-scheduler:
    image: apache/airflow:3.1.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_volumes
    command: scheduler

  airflow-dag-processor:
    image: apache/airflow:3.1.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_volumes
    command: dag-processor

volumes:
  postgres_data:
